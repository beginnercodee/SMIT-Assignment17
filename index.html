<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coca-Cola Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3 transition-all" id="mainNavbar">
        <div class="container d-flex justify-content-between justify-content-lg-center gap-lg-5 px-4 px-lg-5">
            
            <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
                <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/homepage-images/icons/the-coca-cola-company-logo.svg" alt="">
            </a>
    
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
                
                <ul class="navbar-nav d-flex align-items-center mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Our Company</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Brands</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Careers</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Media Center</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Investors</a></li>
                </ul>
    
                <div class="d-flex align-items-center gap-4 ms-lg-5 mt-3 mt-lg-0">
                    <a href="#" class="text-dark"><i class="fa-solid fa-magnifying-glass fs-5"></i></a>
                    <a href="#" class="text-dark"><i class="fa-solid fa-globe fs-5"></i></a>
                    <a href="#" class="text-dark"><i class="fa-solid fa-person text-dark fs-4"></i></a>
                </div>
    
            </div>
        </div>
    </nav>

    <section class="hero-gradient d-flex align-items-center justify-content-center min-vh-100 pb-5 pt-5">
    
        <div class="container position-relative" style="max-width: 1200px;">
            
            <div id="heroCarousel" class="carousel slide" data-bs-ride="carousel">
                
                <div class="carousel-inner rounded-5 shadow-lg position-relative">
                    
                    <div class="carousel-item active">
                        <img src="https://www.coca-colacompany.com/content/dam/company/us/en/fifa-trophy-tour-2026/FIFA-TT-homepage-banner-v14.png/width1960.png" class="d-block w-100" alt="FIFA Trophy Tour">
                    </div>
                    <div class="carousel-item">
                        <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/carousel/2025/november/CCTM_Holiday_Homepage_Carousel_1360x700%20.png/width1960.png" class="d-block w-100" alt="Holiday Carousel">
                    </div>
                    <div class="carousel-item">
                        <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/homepage-images/images/star-wars-desktop.jpg/width1960.jpg" class="d-block w-100" alt="Star Wars">
                    </div>
                    <div class="carousel-item">
                        <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/homepage-images/images/30-billion-dollar-brands-desktop.jpg/width1960.jpg" class="d-block w-100" alt="Billion Dollar Brands">
                    </div>
                    <div class="carousel-item">
                        <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/homepage-images/images/refreshingly-local-desktop.jpg/width1960.jpg" class="d-block w-100" alt="Refreshingly Local">
                    </div>
    
                    <div class="carousel-controls-overlay position-absolute bottom-0 end-0 mb-4 me-4 d-flex flex-column gap-2 z-2">
                        <button class="btn btn-black-circle" type="button" data-bs-target="#heroCarousel" data-bs-slide="next">
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                        <button class="btn btn-black-circle" type="button" data-bs-target="#heroCarousel" data-bs-slide="prev">
                            <i class="fa-solid fa-arrow-left"></i>
                        </button>
                    </div>
    
                </div>
    
                <div class="carousel-indicators position-relative mt-4 mx-auto">
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active dot" aria-current="true"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" class="dot"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" class="dot"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="3" class="dot"></button>
                    <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="4" class="dot"></button>
                </div>
    
            </div>
        </div>
    </section>

    <section class="py-5 bg-white">
        <div class="container py-5">
            <h2 class="mb-4">Scroll down to see the navbar change!</h2>
            <p class="text-muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
            <p class="text-muted" style="height: 800px;">(More content space...)</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const navbar = document.getElementById('mainNavbar');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('navbar-scrolled');
            } else {
                navbar.classList.remove('navbar-scrolled');
            }
        });
    </script>

</body>
</html>
