<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Coca-Cola Company</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top py-3 transition-all" id="mainNavbar">
        <div class="container d-flex justify-content-between justify-content-lg-center gap-lg-5 px-4 px-lg-5">
            
            <a class="navbar-brand d-flex align-items-center gap-2 m-0" href="#">
                <img src="https://www.coca-colacompany.com/content/dam/company/us/en/homepage/homepage-images/icons/the-coca-cola-company-logo.svg" alt="">
            </a>
    
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
    
            <div class="collapse navbar-collapse flex-grow-0" id="navbarNav">
                
                <ul class="navbar-nav d-flex align-items-center mb-2 mb-lg-0 fw-medium">
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Our Company</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Brands</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Careers</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Media Center</a></li>
                    <li class="nav-item"><a class="nav-link px-3 text-dark" href="#">Investors</a></li>
                </ul>
    
                <div class="d-flex align-items-center gap-4 ms-lg-5 mt-3 mt-lg-0">
                    <a href="#" class="text-dark"><i class="fa-solid fa-magnifying-glass fs-5"></i></a>
                    <a href="#" class="text-dark"><i class="fa-solid fa-globe fs-5"></i></a>
                    <a href="#" class="text-dark"><i class="fa-solid fa-person text-dark fs-4"></i></a>
                </div>
    
            </div>
        </div>
    </nav>

    <section class="hero-gradient d-flex align-items-center justify-content-center text-white" style="height: 100vh;">
        <div class="text-center">
            <h1 class="display-1 fw-bold">Refresh the World.</h1>
            <p class="lead">Make a difference.</p>
        </div>
    </section>

    <section class="py-5 bg-white">
        <div class="container py-5">
            <h2 class="mb-4">Scroll down to see the navbar change!</h2>
            <p class="text-muted">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
            <p class="text-muted" style="height: 800px;">(More content space...)</p>
        </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const navbar = document.getElementById('mainNavbar');

        window.addEventListener('scroll', () => {
            if (window.scrollY > 50) {
                navbar.classList.add('navbar-scrolled');
            } else {
                navbar.classList.remove('navbar-scrolled');
            }
        });
    </script>

</body>
</html>
